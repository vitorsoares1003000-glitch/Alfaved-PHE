<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AlfaVed PHE v43.4</title>
<style>
:root{--ae:#1a3a5c;--am:#2d5a8e;--vd:#2d9e4a;--vm:#d94a4a;--am2:#f0a830;--cl:#f5f7fa;--cm:#d0d5dd;--ce:#4a5568;--br:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--cl);color:#2d3748;font-size:13px}
.hdr{background:linear-gradient(135deg,var(--ae),var(--am));color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:16px}
.vbg{background:var(--am2);color:var(--ae);padding:2px 10px;border-radius:4px;font-weight:800;font-size:12px}
.ctn{max-width:1400px;margin:0 auto;padding:15px;display:grid;grid-template-columns:340px 1fr;gap:15px}
.sb{background:var(--br);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:15px;height:fit-content}
.sb h3{font-size:11px;font-weight:700;color:var(--ae);margin:12px 0 6px;border-bottom:1px solid var(--cl);padding-bottom:4px}
.sb h3:first-child{margin-top:0}
.fg{margin-bottom:8px}
.fg label{display:block;font-size:10px;font-weight:600;color:var(--ce);margin-bottom:2px}
.fg input,.fg select{width:100%;padding:6px 8px;border:1px solid var(--cm);border-radius:4px;font-size:12px}
.fr{display:flex;gap:6px}.fr .fg{flex:1}
.bc{width:100%;background:var(--vd);color:#fff;border:none;padding:11px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
.ba{width:100%;background:var(--am);color:#fff;border:none;padding:8px;border-radius:6px;font-size:11px;cursor:pointer;margin-top:6px}
.main{display:flex;flex-direction:column;gap:12px}
.cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{background:var(--br);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px;text-align:center}
.mc-val{font-size:22px;font-weight:800;color:var(--ae)}
.mc-lbl{font-size:10px;color:var(--ce);margin-top:2px}
.cr{background:var(--br);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:15px}
.ct{font-size:14px;font-weight:700;color:var(--ae);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.res-badge{padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700}
.res-badge.ok{background:var(--vd);color:#fff}
.res-badge.notok{background:var(--vm);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:var(--ae);color:#fff;padding:6px 8px;text-align:left}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--cm)}
.tbl tr.hl td{background:#e6f4ea;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
.ck-ok{color:var(--vd)}.ck-err{color:var(--vm)}.ck-w{color:var(--am2)}
.tw{background:#f8d7da;border:1px solid var(--vm);border-radius:6px;padding:10px;margin:8px 0;font-size:12px;color:#721c24;font-weight:600;display:none}
#tcanvas{width:100%;height:260px;background:#fff;border-radius:6px}
.ms{max-height:220px;overflow-y:auto;border:1px solid var(--cm);border-radius:4px}
.tm{width:100%;border-collapse:collapse;font-size:10px}
.tm th{background:var(--am);color:#fff;padding:4px;text-align:left;position:sticky;top:0}
.tm td{padding:4px;border-bottom:1px solid var(--cm)}
</style>
</head>
<body>
<div class="hdr">
<div><h1>Alfa<span style="color:#cc3300">Ved</span> <span style="color:#f0a830">Dimensionador PHE</span></h1></div>
<span class="vbg">v43.4</span>
</div>
<div class="ctn">
<div class="sb">
<h3>Lado Produto</h3>
<div class="fg"><label>Fluido</label>
<select id="fp"><option value="agua">Água</option><option value="cerveja">Cerveja</option><option value="mosto">Mosto</option><option value="leite">Leite</option><option value="glicol20">Glicol 20%</option></select></div>
<div class="fr"><div class="fg"><label>Brix(%)</label><input type="number" id="bp" value="0"></div>
<div class="fg"><label>Vazão(m³/h)</label><input type="number" id="vp" value="20"></div></div>
<div class="fr"><div class="fg"><label>T.Ent(°C)</label><input type="number" id="tip" value="45"></div>
<div class="fg"><label>T.Sai(°C)</label><input type="number" id="top" value="56"></div>
<div class="fg"><label>ΔP(kPa)</label><input type="number" id="dpp" value="50"></div></div>
<h3>Lado Serviço</h3>
<div class="fg"><label>Fluido</label>
<select id="fs" onchange="tgServ()"><option value="vapor">Vapor (Saturado)</option><option value="agua">Água</option><option value="glicol20">Glicol 20%</option></select></div>
<div class="fg" id="bx_vapor"><label>Pressão Vapor(bar)</label>
<select id="pvap"><option value="2">2 bar (~120°C)</option><option value="3">3 bar (~134°C)</option><option value="6">6 bar (~159°C)</option></select></div>
<div class="fr"><div class="fg"><label>Vazão(m³/h)</label><input type="number" id="vs" value="15"></div>
<div class="fg"><label>T.Ent(°C)</label><input type="number" id="tis" value="120"></div></div>
<div class="fr"><div class="fg"><label>T.Sai(°C)</label><input type="number" id="tos" value="120"></div>
<div class="fg"><label>ΔP(kPa)</label><input type="number" id="dps" value="50"></div></div>
<h3>Projeto</h3>
<div class="fr"><div class="fg"><label>Placa</label><select id="tpl"><option value="g">Gasketed</option><option value="t">Todas</option></select></div>
<div class="fg"><label>Passes</label><select id="ps"><option value="auto">Auto</option><option value="1-1">1-1</option><option value="2-2">2-2</option></select></div></div>
<div class="fr"><div class="fg"><label>Margem(%)</label><input type="number" id="mg" value="10"></div>
<div class="fg"><label>Fouling Rf</label><input type="number" id="rf" value="0.0001" step="0.00001"></div></div>
<button class="bc" onclick="calc()">Calcular</button>
<button class="ba" onclick="limpar()">Limpar</button>
<h3>Catálogo de Placas</h3>
<div class="ms"><table class="tm"><thead><tr><th>Mod</th><th>β</th><th>A(m²)</th><th>Dh</th></tr></thead><tbody id="cat"></tbody></table></div>
</div>
<div class="main">
<div class="tw" id="thermalWarn"></div>
<div id="res" style="display:none">
<div class="cards-row" id="cards"></div>
<div class="cr"><div class="ct"><div class="ct-l">Modelo Selecionado</div><span class="res-badge ok" id="badge">VIÁVEL</span></div><div id="selInfo"></div></div>
<div class="grid2">
<div class="cr"><div class="ct">Diagrama de Temperatura</div><canvas id="tcanvas"></canvas></div>
<div class="cr"><div class="ct">Comparativo</div><div id="comp" style="max-height:260px;overflow-y:auto"></div></div>
</div>
<div class="cr"><div class="ct">Verificações</div><div id="ver"></div></div>
</div>
</div>
</div>
<script>
// ===== DADOS DAS PLACAS (26 modelos) =====
var BK=[
{n:'CLIP6',w:.15,l:.40,b:.0025,be:60,dp:.025,d:.0004,ph:1.15,ap:.024},
{n:'CLIP8',w:.22,l:.55,b:.003,be:45,dp:.032,d:.0004,ph:1.17,ap:.050},
{n:'M3',w:.18,l:.48,b:.0025,be:60,dp:.032,d:.0004,ph:1.15,ap:.032},
{n:'T5',w:.245,l:.737,b:.003,be:30,dp:.05,d:.0005,ph:1.17,ap:.080},
{n:'M6-B',w:.32,l:.92,b:.0035,be:30,dp:.05,d:.0004,ph:1.17,ap:.108},
{n:'M6-M',w:.32,l:.92,b:.003,be:45,dp:.05,d:.0004,ph:1.17,ap:.108},
{n:'TL6-B',w:.32,l:1.264,b:.004,be:30,dp:.065,d:.0005,ph:1.20,ap:.150},
{n:'TS6-M',w:.4,l:.704,b:.0035,be:45,dp:.065,d:.0005,ph:1.20,ap:.140},
{n:'M10-B',w:.47,l:1.084,b:.0035,be:30,dp:.1,d:.0005,ph:1.20,ap:.242},
{n:'M10-M',w:.47,l:1.084,b:.003,be:45,dp:.1,d:.0005,ph:1.20,ap:.242},
{n:'TL10-B',w:.65,l:1.95,b:.004,be:30,dp:.1,d:.0005,ph:1.22,ap:.560},
{n:'TL10-P',w:.65,l:1.95,b:.004,be:60,dp:.1,d:.0005,ph:1.22,ap:.560},
{n:'M15-B',w:.61,l:1.941,b:.004,be:30,dp:.15,d:.0005,ph:1.22,ap:.480},
{n:'M15-M',w:.61,l:1.941,b:.0035,be:45,dp:.15,d:.0005,ph:1.22,ap:.480},
{n:'T20-B',w:.78,l:2.145,b:.005,be:30,dp:.2,d:.0006,ph:1.25,ap:.800},
{n:'M20-M',w:.7,l:1.8,b:.0045,be:45,dp:.2,d:.0006,ph:1.25,ap:.650},
{n:'TS20-M',w:.74,l:1.405,b:.0045,be:45,dp:.2,d:.0006,ph:1.22,ap:.500},
{n:'M30',w:.9,l:2.5,b:.005,be:30,dp:.3,d:.0006,ph:1.25,ap:1.100},
{n:'MA30-S',w:.9,l:2.5,b:.006,be:30,dp:.3,d:.0006,ph:1.25,ap:1.100},
{n:'M10-BW',w:.47,l:1.084,b:.0035,be:60,dp:.1,d:.0005,ph:1.20,ap:.242},
{n:'MK15-BW',w:.65,l:1.486,b:.004,be:60,dp:.15,d:.0005,ph:1.22,ap:.480},
{n:'A15-BW',w:.65,l:1.55,b:.0038,be:60,dp:.15,d:.0005,ph:1.22,ap:.560},
{n:'T20-BW',w:.78,l:2.145,b:.0045,be:60,dp:.2,d:.0006,ph:1.25,ap:.800},
{n:'T20-MW',w:.78,l:2.145,b:.004,be:45,dp:.2,d:.0006,ph:1.25,ap:.800},
{n:'M20-MW',w:.7,l:1.8,b:.004,be:45,dp:.2,d:.0006,ph:1.25,ap:.650},
{n:'WideGap350-S',w:.85,l:2.2,b:.007,be:30,dp:.25,d:.0006,ph:1.25,ap:.950}
];
var MT={AISI316:{k:16.2},TIT:{k:15},HAST:{k:9.7}};
var HFG={2:2202,3:2163,6:2086,10:2014};
var PASSOS=['1-1','2-2','1-2','2-1','3-3','4-4'];

// ===== PROPRIEDADES =====
function pAg(T){return{rho:Math.max(1000*(1-Math.pow(Math.abs(T-4)/622,1.71)),800),cp:4182,mu:Math.max(1e-3*(1.78-.057*T+.00106*T*T),1e-5),k:Math.max(.5706+.00176*T,.1)}}
function pCe(T){var w=pAg(T),we=.04;return{rho:w.rho*(1-we)+(789-.8*(T-20))*we,cp:w.cp*(1-we)+(2430+5*T)*we,mu:Math.max(Math.exp((1-we)*Math.log(w.mu)+we*Math.log(1.2e-3*Math.exp(-.018*(T-20))))*1.15,1e-5),k:Math.max(w.k*(1-we)+(.171-.0003*(T-20))*we,.3)}}
function pMo(T,P){return pSa(T,P||12)}
function pLt(T){var w=pAg(T);return{rho:w.rho+14-.4*(T-20),cp:Math.max(w.cp-250,3500),mu:Math.max(w.mu*(1.5+.01*(20-T)),1e-5),k:Math.max(w.k-.02,.4)}}
function pGl(T,c){var w=c/100,wt=pAg(T);return{rho:wt.rho*(1-w)+(1113-.64*(T-20))*w,cp:wt.cp*(1-w)+(2350+3.8*T)*w,mu:Math.max(Math.exp((1-w)*Math.log(wt.mu)+w*Math.log(.021*Math.exp(-.025*(T-20)))),1e-5),k:Math.max(wt.k*(1-w)+(.252-.0003*(T-20))*w,.15)}}
function pSa(T,B){var w=B/100,wt=pAg(T);var dr=3.8749*w+.0174*w*w-.0063*w*T;var cp=wt.cp*(1-w)+(1262+4.524*T)*w;var lM=Math.log10(wt.mu);var lR=3.2488*w+7.5*w*w+14.2*w*w*w-.03*w*T;return{rho:Math.max(wt.rho+dr,800),cp:Math.max(cp,1500),mu:Math.max(Math.pow(10,lM+lR),1e-5),k:Math.max(wt.k-.424*w+.001*T,.15)}}
function gP(f,T,b){switch(f){case'agua':return pAg(T);case'cerveja':return pCe(T);case'mosto':return pMo(T,b);case'leite':return pLt(T);case'glicol20':return pGl(T,20);default:return pAg(T)}}
function gPS(fs,T){switch(fs){case'agua':return pAg(T);case'vapor':return pAg(T);case'glicol20':return pGl(T,20);default:return pAg(T)}}

// ===== CORRELAÇÕES =====
function safeDiv(a,b,fb){var d=Math.abs(b);if(!isFinite(d)||d<1e-12)return(fb!==undefined)?fb:0;return a/b}
function nMartin(Re,Pr,be){var b=be*Math.PI/180;var g=(Math.cos(b)*Math.cos(b))/(.045*Math.tan(b)+3.7*Math.sin(b))+(Math.sin(b)*Math.sin(b))/(2.25/Math.tan(b)+.125*Math.cos(b));return Math.max(.122*Math.pow(Math.max(Pr,.1),1/3)*Math.pow(Math.max(Re,1),.75)*Math.pow(Math.max(g,.001),-1/6),1)}
function fMartin(Re,be){var b=be*Math.PI/180;var g=(Math.cos(b)*Math.cos(b))/(.045*Math.tan(b)+3.7*Math.sin(b))+(Math.sin(b)*Math.sin(b))/(2.25/Math.tan(b)+.125*Math.cos(b));return Math.max(.5*Math.pow(1/Math.max(Re,1),.25)*Math.pow(Math.max(g,.001),-1/6),.001)}
function nKumar(Re,Pr,be){var Ch,n;if(be<=30){Ch=Re<=10?0.718:0.348;n=Re<=10?0.349:0.663}else if(be<=45){if(Re<10){Ch=0.718;n=0.349}else if(Re<100){Ch=0.400;n=0.503}else{Ch=0.348;n=0.663}}else{Ch=Re<10?0.718:0.481;n=Re<10?0.349:0.663}return Math.max(Ch*Math.pow(Math.max(Re,1),n)*Math.pow(Math.max(Pr,.1),1/3),1)}
function fKumar(Re,be){var Kp,m;if(be<=30){if(Re<=10){Kp=50;m=1}else if(Re<=100){Kp=19.4;m=.589}else{Kp=2.99;m=.183}}else if(be<=45){if(Re<15){Kp=47;m=1}else if(Re<100){Kp=18.29;m=.65}else{Kp=2.99;m=.183}}else{Kp=Re<10?50:3;m=Re<10?1:.183}return Math.max(Kp/Math.pow(Math.max(Re,1),m),.001)}
function nAvg(Re,Pr,be){return(nMartin(Re,Pr,be)+nKumar(Re,Pr,be))/2}
function fAvg(Re,be){return 0.3*fMartin(Re,be)+0.7*fKumar(Re,be)}
function wallShear(dp,De,L){return Math.abs(safeDiv(dp*De,4*Math.max(L,.001),0))}
function condHNusselt(p,Ts,Tw,Lp){var kl=.686,rhol=943,rhov=1.12,g=9.81,hfg=(HFG[p||2]||2202)*1000,mul=.000231,dT=Math.max(Math.abs(Ts-Tw),1);return Math.max(Math.min(1.5*0.943*Math.pow(kl*kl*kl*rhol*(rhol-rhov)*g*hfg/(mul*Lp*dT),.25),20000),5000)}
function isVapor(fs,tis,tos){return fs==='vapor'||Math.abs(tis-tos)<0.1}
function calcVaporFlow(Qkw,p){var hfg=HFG[p||2]||2202;var mV=safeDiv(Qkw,hfg,0);var vCond=safeDiv(mV,943,0)*3600;return{mVapor:mV,vCond:vCond,hfg:hfg}}
function cDp(m,r,D,L,phi,N,Ap,v,be,Re){var Cf=fAvg(Re,be),Lr=L*phi,dpc=4*Cf*(Lr*N/D)*(r*v*v/2),vp=safeDiv(m,r*Math.max(Ap,1e-6),0),dpp=1.4*r*vp*vp/2*N,t=safeDiv(dpc+dpp,1000,0),fp=safeDiv(dpp/1000,t,0)*100,tau=wallShear(dpc,D,Lr*N);return{t:t,vp:vp,fracPorta:fp,tau:tau}}
function cL(a,b,c,d){var d1=a-d,d2=b-c;if(Math.abs(d1)<.001&&Math.abs(d2)<.001)return .001;if(Math.abs(d1-d2)<.01)return Math.abs(d1);d1=Math.abs(d1);d2=Math.abs(d2);if(d1<.001)return d2;if(d2<.001)return d1;return Math.abs((d1-d2)/Math.log(d1/d2))}
function fF(P,R,a){if(a==='1-1')return 1;if(Math.abs(R-1)<.001)R=1.001;if(Math.abs(1-P*R)<.001)P=.999/Math.max(R,.001);var s=Math.sqrt(R*R+1),num=s*Math.log(Math.abs((1-P)/(1-P*R))),den=(R-1)*Math.log(Math.abs((2-P*(R+1-s))/(2-P*(R+1+s))));if(Math.abs(den)<1e-10)return .75;return Math.max(Math.min(num/den,1),0)}

// ===== DETECÇÃO QUENTE/FRIO =====
function detectHotCold(inp){
var tip=inp.tip,top=inp.top,tis=inp.tis,tos=inp.tos,fs=inp.fs;
var vm=isVapor(fs,tis,tos);
var pC=tip>top,sC=tis>tos;
if(!vm&&((pC&&sC)||(!pC&&!sC)))return{error:'Impossivel: ambos os lados '+(pC?'resfriando':'aquecendo')};
var hot,cold;
if(pC&&!vm){hot={in:tip,out:top,fluid:inp.fp,b:inp.bp,side:'prod'};cold={in:tis,out:tos,fluid:inp.fs,b:0,side:'serv'}}
else{hot={in:tis,out:tos,fluid:inp.fs,b:0,side:'serv'};cold={in:tip,out:top,fluid:inp.fp,b:inp.bp,side:'prod'}}
return{hot:hot,cold:cold,pCool:pC||vm,vm:vm,error:null}
}

// ===== COEFICIENTE GLOBAL U =====
function cU(p){
var hc=detectHotCold({tip:p.t2i,top:p.t2o,tis:p.t1i,tos:p.t1o,fs:p.f1,fp:p.f2,bp:p.b2});
var Th,Tc,Tw;
if(hc.error){Th=Math.max(p.t1i,p.t2i);Tc=Math.min(p.t1i,p.t2i);Tw=(Th+Tc)/2}
else{Th=(hc.hot.in+hc.hot.out)/2;Tc=(hc.cold.in+hc.cold.out)/2;Tw=(Th+Tc)/2}
var Ua=0,r={};var vm=hc.vm||isVapor(p.f1,p.t1i,p.t1o);var rf=p.rf||.0001;
for(var i=0;i<50;i++){
var bh,bc,wh,wc;
if(hc.hot){bh=hc.hot.side==='prod'?gP(hc.hot.fluid,Th,hc.hot.b):gPS(hc.hot.fluid,Th);wh=hc.hot.side==='prod'?gP(hc.hot.fluid,Tw,hc.hot.b):gPS(hc.hot.fluid,Tw)}
else{bh=gPS(p.f1,Th);wh=gPS(p.f1,Tw)}
if(hc.cold){bc=hc.cold.side==='prod'?gP(hc.cold.fluid,Tc,hc.cold.b):gPS(hc.cold.fluid,Tc);wc=hc.cold.side==='prod'?gP(hc.cold.fluid,Tw,hc.cold.b):gPS(hc.cold.fluid,Tw)}
else{bc=gP(p.f2,Tc,p.b2);wc=gP(p.f2,Tw,p.b2)}
var Nh,Nc,hh,hc2;
if(vm){hh=condHNusselt(p.pressure||2,hc.hot.in,Tw,p.Lplate||0.7);Nh=hh*p.Dh/Math.max(bh.k,.001)}
else{Nh=nAvg(p.Re1,p.Pr1,p.be);hh=Nh*bh.k/Math.max(p.Dh,1e-6)}
Nc=nAvg(p.Re2,p.Pr2,p.be);hc2=Nc*bc.k/Math.max(p.Dh,1e-6);
var kc=1/(1/hh+1/hc2+p.d/p.km),kd=safeDiv(1,safeDiv(1,kc,0)+rf,0);
var TwN=Tc+(hh/Math.max(hh+hc2,.001))*(Th-Tc);Tw=Tw+0.6*(TwN-Tw);
r={U:kd,kc:kc,h1:hh,h2:hc2,Tw:Tw,vapor:vm};
if(Math.abs(kd-Ua)<.5)break;Ua=kd}
return r}

// ===== CÁLCULO DE UMA SEÇÃO =====
function mCalcSingle(inp,hc){
var pb=gP(inp.fp,(inp.tip+inp.top)/2,inp.bp),mp=inp.vp*pb.rho/3600,Q=mp*pb.cp*Math.abs(inp.top-inp.tip)/1000;
var sb=gPS(inp.fs,(inp.tis+inp.tos)/2),ms=inp.vs*sb.rho/3600;
var lm=cL(hc.hot.in,hc.hot.out,hc.cold.in,hc.cold.out);
var Pv=safeDiv(hc.cold.out-hc.cold.in,Math.max(hc.hot.in-hc.cold.in,.001),0);
var Rv=safeDiv(hc.hot.in-hc.hot.out,Math.max(hc.cold.out-hc.cold.in,.001),0);
var F=fF(Pv,Rv,inp.ps),lc=lm*F;
var Np=parseInt(inp.ps.split('-')[0]),Np2=parseInt(inp.ps.split('-')[1]);
var matK=inp.mat==='auto'?'AISI316':inp.mat,vm=hc.vm,pr=inp.pressure||2,rf=inp.rf||.0001;
var mods=BK.filter(function(m){if(inp.tpl==='t')return true;return true});
var rs=[];
mods.forEach(function(m){
var Dh=2*m.b,Ac=m.b*m.w,Ap=Math.PI*m.dp*m.dp/4;
var ne=Math.ceil(safeDiv(Q*1000,2000*Math.max(lc,.1),0)/m.ap*(1+inp.mg/100));
var nStart=Math.max(5,((Math.floor((ne-8)/2))*2+1));
for(var n=nStart;n<ne+50;n+=2){
var div1=2*Np;
if(((n-1)%div1)!==0)continue;
var nc=(n-1)/div1,nc2=Math.max(Math.floor((n-1)/(2*Np2)),1);
var mcp=mp/nc,mcs=ms/nc2,vcP=safeDiv(mcp,pb.rho*Ac,0),vcS=safeDiv(mcs,sb.rho*Ac,0);
if(vcP<0.1||(!vm&&vcS<0.1))continue;
var Rep=safeDiv(mcp*Dh,Math.max(Ac,1e-8)*Math.max(pb.mu,1e-8),0),Res=safeDiv(mcs*Dh,Math.max(Ac,1e-8)*Math.max(sb.mu,1e-8),0);
var Prp=safeDiv(pb.cp*pb.mu,Math.max(pb.k,.001),0),Prs=safeDiv(sb.cp*sb.mu,Math.max(sb.k,.001),0);
var rU=cU({t1i:inp.tis,t1o:inp.tos,t2i:inp.tip,t2o:inp.top,f1:inp.fs,f2:inp.fp,pressure:pr,b2:inp.bp,Re1:Res,Pr1:Prs,Re2:Rep,Pr2:Prp,be:m.be,Dh:Dh,d:m.d,km:MT[matK].k,Lplate:m.l,rf:rf});
var Ai=n*m.ap,An=safeDiv(Q*1000,Math.max(rU.U*lc,.1),0);
if(Ai>=An){
var dp1=cDp(mp,pb.rho,Dh,m.l,m.ph,Np,Ap,vcP,m.be,Rep);
var dp2;if(vm){dp2={t:dp1.t*0.3,vp:0,fracPorta:0,tau:0}}else{dp2=cDp(ms,sb.rho,Dh,m.l,m.ph,Np2,Ap,vcS,m.be,Res)}
var vi=true;if(dp1.t>inp.dpp)vi=false;if(!vm&&dp2.t>inp.dps)vi=false;if(dp1.vp>4.9)vi=false;if(dp1.fracPorta>30)vi=false;if(dp1.tau<35)vi=false;if(F<0.5)vi=false;
rs.push({mod:m.n,n:n,A:Ai,U:rU.U,kc:rU.kc,dp1:dp1.t,dp2:dp2.t,Q:Q,v1:dp1.vp,vi:vi,tauP:dp1.tau,Rep:Rep,lm:lc,F:F,pb:pb,sb:sb,rU:rU,m:m,lmtd:lm,passes:inp.ps,vaporMode:vm});break
}
});return rs}

// ===== SELEÇÃO DE PASSES =====
function mCalcSec(inp,passesArr,hc){
var hc=hc||detectHotCold(inp);
if(hc.error)return{mod:'N/A',n:0,A:0,U:0,dp1:999,dp2:999,Q:0,vi:false,passesUsado:'1-1',todosCalculados:[]};
var best=null,pt=passesArr||PASSOS;
for(var pi=0;pi<pt.length;pi++){
var ps=pt[pi],inpC=Object.assign({},inp,{ps:ps}),rs=mCalcSingle(inpC,hc),vs=rs.filter(function(r){return r.vi});
if(vs.length>0){vs.sort(function(a,b){return a.A-b.A});var b=vs[0];if(!best||b.A<best.A){best=b;best.passesUsado=ps;best.todosViaveis=vs;best.todosCalculados=rs}break}
}
if(best)return best;
var rs2=mCalcSingle(Object.assign({},inp,{ps:pt[0]}),hc);rs2.sort(function(a,b){return a.A-b.A});
return{mod:rs2[0]?rs2[0].mod:'N/A',n:0,A:0,U:0,dp1:999,dp2:999,Q:0,vi:false,passesUsado:pt[0],todosCalculados:rs2};
}

// ===== FUNÇÃO PRINCIPAL =====
function calc(){
var inp=rInp();
if(!inp.vp||inp.vp<=0){alert('Vazão produto inválida');return}
if(!inp.dpp||inp.dpp<=0){alert('ΔP produto deve ser > 0');return}
if(!inp.dps||inp.dps<=0){alert('ΔP serviço deve ser > 0');return}
var hc=detectHotCold(inp);
var tw=document.getElementById('thermalWarn');
if(hc.error){if(tw){tw.style.display='block';tw.textContent=hc.error}alert(hc.error);return}
if(tw)tw.style.display='none';
if(isVapor(inp.fs,inp.tis,inp.tos)){
var pb0=gP(inp.fp,(inp.tip+inp.top)/2,inp.bp),mp0=inp.vp*pb0.rho/3600,Q0=mp0*pb0.cp*Math.abs(inp.top-inp.tip)/1000,vf=calcVaporFlow(Q0,inp.pressure||2);
inp.vs=vf.vCond;document.getElementById('vs').value=inp.vs.toFixed(2);document.getElementById('vapor_note').style.display='block'
}
if(!inp.vs||inp.vs<=0){alert('Vazão serviço inválida');return}
var dT1=hc.hot.in-hc.cold.out,dT2=hc.hot.out-hc.cold.in;
if(dT1<=0||dT2<=0){alert('Programa térmico inválido: ΔT deve ser positivo.\nΔT1='+dT1.toFixed(1)+' ΔT2='+dT2.toFixed(1));return}
var pt=inp.ps==='auto'?PASSOS:[inp.ps],r=mCalcSec(inp,pt,hc);
showR(r,inp,r.todosCalculados||[]);
}
function rInp(){var fs=document.getElementById('fs').value,pv=document.getElementById('pvap')?document.getElementById('pvap').value:2;return{fp:document.getElementById('fp').value,bp:parseFloat(document.getElementById('bp').value)||0,vp:parseFloat(document.getElementById('vp').value),tip:parseFloat(document.getElementById('tip').value),top:parseFloat(document.getElementById('top').value),dpp:parseFloat(document.getElementById('dpp').value),fs:fs,vs:parseFloat(document.getElementById('vs').value),tis:parseFloat(document.getElementById('tis').value),tos:parseFloat(document.getElementById('tos').value),dps:parseFloat(document.getElementById('dps').value),tpl:document.getElementById('tpl').value,mat:'auto',ps:document.getElementById('ps').value,mg:parseFloat(document.getElementById('mg').value),pressure:parseFloat(pv),rf:parseFloat(document.getElementById('rf').value)||.0001}}
function tgServ(){var fs=document.getElementById('fs').value;document.getElementById('bx_vapor').style.display=fs==='vapor'?'block':'none';if(fs==='vapor'){var pv=document.getElementById('pvap').value,tsat={2:120,3:134,6:159}[pv]||120;document.getElementById('tis').value=tsat;document.getElementById('tos').value=tsat;document.getElementById('vs').value=0.5}}
function limpar(){document.getElementById('res').style.display='none';var tw=document.getElementById('thermalWarn');if(tw)tw.style.display='none'}

// ===== EXIBIÇÃO =====
function showR(m,inp,todos){
document.getElementById('res').style.display='block';
var badge=document.getElementById('badge');
if(m.vi){badge.textContent='VIÁVEL';badge.className='res-badge ok'}else{badge.textContent='NÃO VIÁVEL';badge.className='res-badge notok'}
document.getElementById('selInfo').innerHTML='<div style="font-size:18px;font-weight:800;color:#1a3a5c">'+m.mod+'</div><div style="font-size:11px;color:#4a5568">'+m.n+' placas · '+m.A.toFixed(2)+' m² · Passes '+m.passesUsado+' · '+(m.vaporMode?'NUSSELT COND':'Martin+Kumar')+'</div>';
var qShow=m.vi?m.Q.toFixed(1):'—',uShow=m.vi?m.U.toFixed(0):'—',dpShow=m.vi?m.dp1.toFixed(1):'—',tauShow=m.vi?(m.tauP||0).toFixed(0):'—';
document.getElementById('cards').innerHTML='<div class="mc"><div class="mc-val">'+qShow+'</div><div class="mc-lbl">Carga kW</div></div><div class="mc"><div class="mc-val">'+uShow+'</div><div class="mc-lbl">U W/m²K</div></div><div class="mc"><div class="mc-val">'+dpShow+'</div><div class="mc-lbl">dP Prod</div></div><div class="mc"><div class="mc-val">'+tauShow+'</div><div class="mc-lbl">Shear Pa</div></div>';
var h='<table class="tbl"><thead><tr><th>Modelo</th><th>Pl</th><th>Área</th><th>U</th><th>dP P</th><th>Shear</th><th>F</th><th>Passes</th><th>OK</th></tr></thead><tbody>';
todos.slice(0,12).forEach(function(r,i){h+='<tr class="'+(i===0&&r.vi?'hl':'')+'"><td>'+r.mod+'</td><td>'+r.n+'</td><td>'+r.A.toFixed(2)+'</td><td>'+r.U.toFixed(0)+'</td><td>'+r.dp1.toFixed(1)+'</td><td>'+(r.tauP||0).toFixed(0)+'</td><td>'+r.F.toFixed(2)+'</td><td>'+(r.passes||'')+'</td><td>'+(r.vi?'OK':'X')+'</td></tr>'});
h+='</tbody></table>';
document.getElementById('comp').innerHTML=h;
var v='<div class="ck"><span class="ck-ok">✓</span>LMTD: '+m.lm.toFixed(1)+'°C F='+m.F.toFixed(3)+'</div>';
v+='<div class="ck"><span class="ck-ok">✓</span>Re Prod: '+m.Rep.toFixed(0)+'</div>';
v+='<div class="ck"><span class="'+(m.tauP>=35?'ck-ok':'ck-err')+'">'+(m.tauP>=35?'✓':'✗')+'</span>Wall Shear: '+(m.tauP||0).toFixed(1)+'Pa</div>';
v+='<div class="ck"><span class="'+(m.v1<=4.9?'ck-ok':'ck-err')+'">'+(m.v1<=4.9?'✓':'✗')+'</span>Vel Bocal: '+(m.v1||0).toFixed(2)+'</div>';
document.getElementById('ver').innerHTML=v;
setTimeout(function(){drawTempDiagram(inp,m)},50);
}
function drawTempDiagram(inp,m){var c=document.getElementById('tcanvas');if(!c)return;var ctx=c.getContext('2d'),w=c.offsetWidth,h=c.offsetHeight;c.width=w;c.height=h;ctx.clearRect(0,0,w,h);var hi=inp.tis,ho=inp.tos,ci=inp.tip,co=inp.top;if(inp.tip>inp.tis){hi=inp.tip;ho=inp.top;ci=inp.tis;co=inp.tos}var aT=[hi,ho,ci,co],tMin=Math.min.apply(null,aT)-5,tMax=Math.max.apply(null,aT)+5,pL=50,pR=20,pT=30,pB=30,pW=w-pL-pR,pH=h-pT-pB,xS=function(f){return pL+f*pW},yS=function(T){return pT+(tMax-T)/(tMax-tMin)*pH};ctx.strokeStyle='#cc3300';ctx.lineWidth=2.5;ctx.beginPath();for(var i=0;i<=50;i++){var f=i/50,t=hi+(ho-hi)*f;if(i===0)ctx.moveTo(xS(f),yS(t));else ctx.lineTo(xS(f),yS(t))}ctx.stroke();ctx.strokeStyle='#0099ff';ctx.lineWidth=2.5;ctx.beginPath();for(var i=0;i<=50;i++){var f=i/50,t=ci+(co-ci)*f;if(i===0)ctx.moveTo(xS(f),yS(t));else ctx.lineTo(xS(f),yS(t))}ctx.stroke();ctx.font='bold 11px Segoe UI';ctx.fillStyle='#cc3300';ctx.fillText(hi.toFixed(1)+'°C',pL+8,yS(hi)-8);ctx.fillStyle='#0099ff';ctx.fillText(ci.toFixed(1)+'°C',pL+8,yS(ci)+14);ctx.fillStyle='#2d9e4a';ctx.textAlign='center';ctx.fillText('LMTD='+(m.lm||0).toFixed(1)+'°C',w/2,pT+12)}
